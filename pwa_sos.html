<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Alert Monitor</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#main-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
}

#emergency-screen{
    display:none;
    position:fixed;
    inset:0;
    background:#d32f2f;
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.siren{
    font-size:100px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

button{
    padding:18px 40px;
    font-size:20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    margin-top:30px;
}

.dot{
    width:15px;
    height:15px;
    border-radius:50%;
    background:red;
    display:inline-block;
}

.connected{
    background:green;
}

.disconnected{
    background:red;
}

#status-banner{
    margin-top:20px;
    color:#666;
}
</style>

</head>
<body>

<div id="main-screen">

<h2>SOS Monitor</h2>

<div>
<span id="connection-dot" class="dot disconnected"></span>
<span id="connection-text">Checking...</span>
</div>

<div id="status-banner"></div>

</div>

<div id="emergency-screen">

<div class="siren">🚨</div>

<h1>EMERGENCY ACTIVE</h1>

<h3 id="gps-coordinates">
Waiting...
</h3>

<button id="reset-button">
I'm Safe Now
</button>

</div>

<script>

const ESP32_BASE_URL="http://10.63.183.90:8080";
const POLL_INTERVAL=2000;

let wasEmergencyActive=false;

function updateConnectionIndicator(ok){

const dot=document.getElementById("connection-dot");
const text=document.getElementById("connection-text");

if(ok){
dot.className="dot connected";
text.textContent="Connected";
}else{
dot.className="dot disconnected";
text.textContent="Disconnected";
}

}

function showStatus(msg){
document.getElementById("status-banner").textContent=msg;
}

function showEmergencyAlert(){

console.log("SHOW ALERT");

document.getElementById("main-screen").style.display="none";
document.getElementById("emergency-screen").style.display="flex";

}

function hideEmergencyAlert(){

document.getElementById("main-screen").style.display="flex";
document.getElementById("emergency-screen").style.display="none";

}

async function checkDeviceStatus(){

console.log("Polling...");

try{

const response=await fetch(
`${ESP32_BASE_URL}/status?t=${Date.now()}`,
{
cache:"no-store"
}
);

console.log("HTTP",response.status);

const data=await response.json();

console.log("Received",data);

updateConnectionIndicator(true);

if(data.sosActive===true){

console.log("SOS ACTIVE");

if(!wasEmergencyActive){

wasEmergencyActive=true;

showEmergencyAlert();

document.getElementById("gps-coordinates").textContent=
"Waiting for GPS...";

}

}else{

if(wasEmergencyActive){

console.log("SOS CLEARED");

}

wasEmergencyActive=false;

hideEmergencyAlert();

}

}catch(e){

console.error(e);

updateConnectionIndicator(false);

}

}

async function resetSOS(){

try{

await fetch(
`${ESP32_BASE_URL}/reset?t=${Date.now()}`,
{
cache:"no-store"
}
);

wasEmergencyActive=false;

hideEmergencyAlert();

showStatus("SOS Reset");

}catch(e){

console.error(e);

}

}

document
.getElementById("reset-button")
.addEventListener("click",resetSOS);

checkDeviceStatus();

setInterval(checkDeviceStatus,POLL_INTERVAL);

</script>

</body>
</html>
